---
alias: Cinema Resume
description: ''
triggers:
  - trigger: state
    entity_id:
      - media_player.plex_for_lg
    from: paused
    to: playing
    for:
      hours: 0
      minutes: 0
      seconds: 2
conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: media_player.plex_for_lg
    attribute: media_content_type
    state: movie
  - condition: template
    value_template: >-
      {{ (state_attr('media_player.plex_for_lg', 'username') or '') | lower == 'troy rippin' }}
actions:
  - action: light.turn_off
    metadata: {}
    data:
      transition: 1
    target:
      entity_id:
        - light.living_room_window_lamp
        - light.living_room
        - light.living_room_door_lamp
mode: single
