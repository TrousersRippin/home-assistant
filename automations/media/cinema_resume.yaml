---
alias: Cinema Resume
description: ''
triggers:
  - trigger: state
    entity_id:
      - media_player.plex_for_lg
    from: paused
    to: playing
    for:
      hours: 0
      minutes: 0
      seconds: 2
conditions:
  - condition: sun
    after: sunset
  - condition: state
    entity_id: media_player.plex_for_lg
    attribute: media_content_type
    state: movie
actions:
  - action: light.turn_off
    metadata: {}
    data:
      transition: 1
    target:
      entity_id: light.living_room_window_lamp_01
mode: single
