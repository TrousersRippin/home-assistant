---
alias: Cinema Paused
description: ''
triggers:
  - trigger: state
    entity_id:
      - media_player.plex_for_lg
    to: paused
    for:
      hours: 0
      minutes: 0
      seconds: 2
conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: media_player.plex_for_lg
    attribute: media_content_type
    state: movie
  - condition: template
    value_template: >-
      {{ (state_attr('media_player.plex_for_lg', 'username') or '') | lower == 'troy rippin' }}
actions:
  - action: light.turn_on
    metadata: {}
    data:
      transition: 1
      brightness_pct: 75
    target:
      entity_id: light.living_room_window_lamp_01
mode: single
