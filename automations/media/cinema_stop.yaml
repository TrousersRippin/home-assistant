---
alias: Cinema Stop
description: ''
triggers:
  - trigger: state
    entity_id:
      - media_player.plex_for_lg
    from:
      - playing
      - paused
    to:
      - idle
      - "off"
  # TV powered off can go playing -> unavailable; wait so brief dropouts don't count
  - trigger: state
    entity_id:
      - media_player.plex_for_lg
    from:
      - playing
      - paused
    to: unavailable
    for:
      hours: 0
      minutes: 0
      seconds: 30
conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: template
    value_template: >-
      {{ trigger.from_state.attributes.media_content_type == 'movie' }}
  - condition: template
    value_template: >-
      {{ (trigger.from_state.attributes.username or '') | lower == 'troy rippin' }}
actions:
  - action: light.turn_on
    metadata: {}
    data:
      transition: 5
      brightness_pct: 75
    target:
      entity_id:
        - light.living_room_window_lamp
        - light.living_room_door_lamp
mode: single
