---
alias: Stairway Motion Sensor
description: ""
use_blueprint:
  path: TrousersRippin/ikea_myggspray.yaml
  input:
    motion_entity: binary_sensor.stairway_mtn_sensor_occupancy
    no_motion_wait: 5
    motion_on_action_day:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 3000
          brightness_pct: 75
        target:
          entity_id:
            - light.stairway_lamp
            - light.lounge_standing_lamp
    motion_on_action_night:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 3000
          brightness_pct: 25
        target:
          entity_id: light.stairway_lamp
    motion_off_action:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
            - light.stairway_lamp
            - light.lounge_standing_lamp
    battery_entity: sensor.stairway_mtn_sensor_battery
    battery_low_action:
      - action: notify.mobile_app_troys_iphone_17_pro
        metadata: {}
        data:
          message: low battery!
