---
alias: Front Door Sensor
description: ''
use_blueprint:
  path: TrousersRippin/ikea_myggbett.yaml
  input:
    door_entity: binary_sensor.front_door_sensor
    night_start: "19:00:00"
    action_opened_immediate_night:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 75
        target:
          entity_id: light.hallway_ceiling_lamp
    # Door must stay closed for 2 minutes; reopening resets the timer
    wait_closed_long: 120
    action_closed_long:
      - condition: time
        after: "19:00:00"
        before: "07:00:00"
      - action: light.turn_off
        metadata: {}
        target:
          area_id: hallway
        data: {}
    battery_entity: sensor.front_door_sensor_battery
    battery_low_action:
      - action: notify.mobile_app_troys_iphone
        metadata: {}
        data:
          message: low battery!
