---
alias: Front Door Sensor
description: ""
use_blueprint:
  path: TrousersRippin/ikea_myggbett.yaml
  input:
    door_entity: binary_sensor.front_door_sensor_door
    night_start: "19:00:00"
    action_opened_immediate_night:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 3000
          brightness_pct: 75
        target:
          entity_id: light.hallway_ceiling_lamp
    action_closed_immediate_night:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.hallway_ceiling_lamp
    battery_entity: sensor.front_door_sensor_battery
    battery_low_action:
      - action: notify.mobile_app_troys_iphone_17_pro
        metadata: {}
        data:
          message: low battery!
