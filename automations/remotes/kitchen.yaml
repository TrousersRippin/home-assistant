---
alias: Kitchen Remote
description: ""
use_blueprint:
  path: TrousersRippin/ikea_bilresa_button.yaml
  input:
    button1_event:
      - event.kitchen_remote_button_1
    button2_event:
      - event.kitchen_remote_button_2
    button1_single:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 3000
          brightness_pct: 75
        target:
          entity_id: light.kitchen_ceiling_lamp
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 2500
          brightness_step_pct: 25
        target:
          entity_id:
            - light.kitchen_table_lamp
            - light.kitchen_speaker_lamp
    button1_double:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          entity_id: light.kitchen
    button2_single:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 3000
          brightness_step_pct: -25
        target:
          entity_id: light.kitchen_ceiling_lamp
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 2500
          brightness_step_pct: -25
        target:
          entity_id:
            - light.kitchen_table_lamp
            - light.kitchen_speaker_lamp
    button2_double:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.kitchen
