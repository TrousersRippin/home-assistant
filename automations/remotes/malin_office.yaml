---
alias: Malin's Office Remote
description: ""
use_blueprint:
  path: TrousersRippin/ikea_bilresa_button.yaml
  input:
    button1_event:
      - event.malin_office_remote_button_1
    button2_event:
      - event.malin_office_remote_button_2
    button1_single:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 2500
          brightness_pct: 100
        target:
          entity_id: light.malin_office_standing_lamp
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 2500
          brightness_pct: 70
        target:
          entity_id: light.malin_office_wall_lamp
    button1_double:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          entity_id: light.malin_office
    button2_single:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
            - light.malin_office_standing_lamp
            - light.malin_office_wall_lamp
    button2_double:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.malin_office
