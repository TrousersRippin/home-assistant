---
alias: Troy's Office Remote
description: ''
use_blueprint:
  path: TrousersRippin/ikea_bilresa_button.yaml
  input:
    button1_event:
      - event.troy_office_remote_button_1
    button2_event:
      - event.troy_office_remote_button_2
    button1_single:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: 25
        target:
          entity_id: 
            - light.troy_office_standing_lamp
            - light.troy_office_desk_lamp
    button1_double:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 75
        target:
          entity_id: light.troy_office
    button1_long_press:
      - action: cover.set_cover_position
        metadata: {}
        target:
          entity_id: cover.desk_5250
        data:
          position: 75
    button2_single:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: -25
        target:
          entity_id: 
            - light.troy_office_standing_lamp
            - light.troy_office_desk_lamp
    button2_double:
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.troy_office
    button2_long_press:
      - action: cover.set_cover_position
        metadata: {}
        target:
          entity_id: cover.desk_5250
        data:
          position: 55
